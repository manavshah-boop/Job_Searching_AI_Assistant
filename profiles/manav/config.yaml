sources:
  greenhouse:
    enabled: false
    companies: []
  lever:
    enabled: false
    companies: []
  hn:
    enabled: false
  ashby:
    enabled: true
    companies:
    - OpenAI
  workable:
    enabled: false
    companies: []
  himalayas:
    enabled: false

scoring:
  min_display_score: 60
  weights:
    role_fit: 0.3
    stack_match: 0.25
    seniority: 0.2
    location: 0.1
    growth: 0.1
    compensation: 0.05

embeddings:
  enabled: true
  model: sentence-transformers/all-MiniLM-L6-v2
  batch_size: 8
  vector_store:
    enabled: true
    provider: chromadb
    persist_directory: null
    collection_name: job_chunks
    top_k_chunks: 50
    top_k_jobs: 30
    strict: false

tracking:
  mlflow:
    enabled: true
    tracking_uri: ./mlruns
    experiment_name: job-agent
    log_artifacts: true
    log_eval_labels: false

routing:
  enabled: true
  threshold: 0.65          # base threshold (kept for reference)
  llm_threshold: 0.18      # per-profile override — lowered so that most plausible jobs
                           # reach the LLM; title-match boost (+0.15) lifts obvious roles
                           # above this floor. Tune higher (e.g. 0.25) to save API calls.
  quality_mode: fast
  log_routing_decisions: true
  # Three-tier routing: high-confidence jobs use a cheap fast model;
  # uncertain/low-confidence jobs get the quality model for deeper analysis.
  # primary_model selects the first-choice provider/model for each tier.
  # quality_mode is kept for backwards compatibility with non-budget code paths.
  tiers:
    high:
      min_reranker: 0.40
      require_title_match: true
      primary_model: "groq/llama-3.1-8b-instant"
      quality_mode: fast
      max_tokens: 500
    medium:
      min_reranker: 0.25
      primary_model: "groq/llama-4-scout-17b-16e-instruct"
      quality_mode: fast
      max_tokens: 800
    low:
      min_reranker: 0.18
      primary_model: "gemini/gemini-2.5-flash"
      quality_mode: quality
      max_tokens: 1200

  # Provider fallback chain — when a tier's primary_model budget is exhausted or
  # the provider returns a 429, the router tries these providers in order.
  # openai is included but skipped at runtime if OPENAI_API_KEY is not set.
  fallback_chain:
    - groq
    - gemini
    - cerebras
    - openai
    - openrouter
    - mistral

  # Per-run budget caps — conservative limits that fit comfortably within each
  # provider's free-tier daily quota, leaving headroom for other uses of the key.
  rate_limit_budget:
    groq:
      max_requests_per_run: 15
      max_tokens_per_run: 75000
    gemini:
      max_requests_per_run: 12
      max_tokens_per_run: 100000
    cerebras:
      max_requests_per_run: 10
      max_tokens_per_run: 80000
    openai:
      max_requests_per_run: 5
      max_tokens_per_run: 40000
    openrouter:
      max_requests_per_run: 15
      max_tokens_per_run: 100000
    mistral:
      max_requests_per_run: 3
      max_tokens_per_run: 20000
